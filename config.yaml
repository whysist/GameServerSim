server:
  host: "127.0.0.1"
  port: 8000

load_test:
  duration_seconds: 60

  player_counts:
    - 10
    - 50
    - 100
    - 250
    - 500

  ramp_up_seconds: 10

  # Optional: fixes which player IDs get which player type.
  # seed: 42

player:
  # action_count applies to normal players only. Competitive (15-30)
  # and reconnecting (5-10) players keep their own ranges.
  action_count:
    min: 5
    max: 15

  action_delay_ms:
    min: 50
    max: 500

# Player-type mix. Weights are relative; players are assigned in these
# exact proportions (rounded), not by random draw.
scenarios:
  normal_player:
    weight: 70

  competitive_player:
    weight: 20

  reconnecting_player:
    weight: 10

output:
  directory: "results"
  raw_metrics: "results/metrics.csv"